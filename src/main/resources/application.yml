spring:
  application:
    name: boardgame-reservation

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/boardgame}
    username: ${DB_USERNAME:boardgame}
    password: ${DB_PASSWORD:boardgame}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  session:
    data:
      redis:
        # indexed: principal name(email) 기준 세션 조회/삭제 가능 (FindByIndexNameSessionRepository).
        # 관리자 승인 시 해당 회원의 기존 세션을 무효화하는 데 사용. 기동 시 Redis 에 notify-keyspace-events 를 설정한다.
        # (CONFIG 가 막힌 관리형 Redis 에서는 configure-action: none + 파라미터 그룹에서 직접 설정)
        repository-type: indexed

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  jpa:
    open-in-view: false          # 트랜잭션 밖(컨트롤러/뷰)에서 지연로딩 금지 → 커넥션 오래 잡는 문제 방지
    hibernate:
      ddl-auto: update           # 개발 중에만. 배포 전에는 validate + 스키마 스크립트로 전환
    properties:
      hibernate:
        format_sql: true
    show-sql: false

server:
  servlet:
    # 세션 저장소는 Spring Session(Redis). 아래 timeout/cookie 설정이 그대로 Redis 세션 TTL·쿠키에 적용된다.
    session:
      timeout: 30m
      cookie:
        name: JSESSIONID         # Spring Session 기본값(SESSION) 대신 기존 쿠키명 유지 (SecurityConfig 로그아웃 deleteCookies 와 일치)
        http-only: true          # JS에서 세션 쿠키 접근 불가 (XSS 탈취 방지)
        same-site: lax           # 교차 사이트 POST에 쿠키 안 붙음 (CSRF 완화)

app:
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  upload:
    dir: ${UPLOAD_DIR:./uploads}   # LocalFileStorage 저장 위치 (7단계 배포 때 S3 구현체로 교체 예정)

logging:
  level:
    org.hibernate.SQL: debug
