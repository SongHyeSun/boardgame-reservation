services:
  postgres:
    image: postgres:16
    container_name: boardgame-postgres
    environment:
      POSTGRES_DB: boardgame
      POSTGRES_USER: boardgame
      POSTGRES_PASSWORD: boardgame1234
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: boardgame-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data: