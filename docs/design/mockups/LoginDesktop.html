<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>로그인 데스크톱</title>
<link rel="stylesheet" href="ds/boardclub/components/bundle.css">
<link rel="stylesheet" href="screens.css">
</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}
</style>

<div class="scr" style="width: 1280px; height: 800px;">
<div class="auth-split">
<div class="auth-art">
<svg viewBox="0 0 640 520" width="640" height="520" aria-hidden="true">
<rect x="360" y="-40" width="220" height="220" rx="28" style="fill:var(--meeple)"></rect>
<circle cx="410" cy="10" r="18" style="fill:var(--ink)"></circle><circle cx="470" cy="70" r="18" style="fill:var(--ink)"></circle><circle cx="530" cy="130" r="18" style="fill:var(--ink)"></circle>
<rect x="220" y="200" width="180" height="180" rx="28" style="fill:var(--felt-soft)"></rect>
<circle cx="265" cy="245" r="15" style="fill:var(--felt)"></circle><circle cx="355" cy="245" r="15" style="fill:var(--felt)"></circle><circle cx="265" cy="335" r="15" style="fill:var(--felt)"></circle><circle cx="355" cy="335" r="15" style="fill:var(--felt)"></circle>
<rect x="430" y="220" width="140" height="140" rx="24" style="fill:var(--felt-edge)"></rect>
<circle cx="500" cy="290" r="14" style="fill:var(--meeple)"></circle>
</svg>
<h2>보드게임<br>동아리</h2>
<p>이번 주 같이 할 게임과 사람을 찾고, 동아리 게임을 빌려 가요.</p>
</div>

<main class="auth-form">
<div><h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 700;">로그인</h1><p class="lede" style="font-size: 15px; margin-top: 4px;">동아리 계정으로 들어와 주세요</p></div>
<form class="form">
<label class="tb-field"><span class="tb-field__label">이메일</span><input class="tb-input" type="email" value="minji@example.com" autocomplete="email"></label>
<label class="tb-field"><span class="tb-field__label">비밀번호</span><input class="tb-input" type="password" value="password" autocomplete="current-password"></label>
<button class="tb-btn tb-btn--primary tb-btn--lg tb-btn--block" type="submit">로그인</button>
</form>
<p class="auth__alt" style="text-align: left;">처음이신가요? <a class="link" href="Signup.html">회원가입</a></p>
</main>
</div>
</div>

</body>
</html>
