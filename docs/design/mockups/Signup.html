<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>회원가입</title>
<link rel="stylesheet" href="ds/boardclub/components/bundle.css">
<link rel="stylesheet" href="screens.css">
</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}
</style>

<div class="scr" style="width: 390px; height: 1440px;">
<main class="page" style="gap: 24px; padding-top: 24px;">
<a class="back" href="Login.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>로그인</a>
<div>
<h1 class="page-title">회원가입</h1>
<p class="lede">* 표시는 꼭 입력해 주세요</p>
</div>

<section class="section">
<h2 class="section-title" style="font-size: 17px; line-height: 24px;">프로필 사진</h2>
<div style="display: flex; align-items: center; gap: 16px;">
<span class="tb-avatar tb-avatar--xl s3">🎲</span>
<div style="display: flex; flex-direction: column; gap: 8px;">
<div class="tb-seg" role="group" aria-label="아바타 종류"><button aria-pressed="true">이모지</button><button aria-pressed="false">사진 올리기</button></div>
<span class="small muted">사진은 jpg·png·webp, 5MB까지</span>
</div>
</div>
<div class="emoji-grid" role="group" aria-label="이모지 선택">
<button aria-pressed="true">🎲</button><button>🃏</button><button>♟️</button><button>🧩</button><button>🎯</button><button>🏆</button><button>🐉</button><button>🦊</button>
<button>🐱</button><button>🐻</button><button>🐧</button><button>🦉</button><button>🌟</button><button>🔥</button><button>🍀</button><button>🎩</button>
</div>
</section>

<hr class="divider">

<form class="form">
<label class="tb-field"><span class="tb-field__label">이메일<span class="req">*</span></span><input class="tb-input" type="email" placeholder="name@example.com"></label>
<label class="tb-field"><span class="tb-field__label">비밀번호<span class="req">*</span></span><input class="tb-input" type="password" placeholder="8자 이상"><span class="tb-field__hint">영문·숫자·특수문자를 섞어 8자 이상</span></label>
<div class="two">
<label class="tb-field"><span class="tb-field__label">이름<span class="req">*</span></span><input class="tb-input" value="송혜선"></label>
<label class="tb-field"><span class="tb-field__label">닉네임<span class="req">*</span></span><input class="tb-input" value="혜선"></label>
</div>
<label class="tb-field"><span class="tb-field__label">생년월일</span><input class="tb-input" type="date"></label>
<div class="two">
<label class="tb-field"><span class="tb-field__label">소속</span><input class="tb-input" placeholder="예: 청년부"></label>
<label class="tb-field"><span class="tb-field__label">직업</span><input class="tb-input" placeholder="예: 개발자"></label>
</div>
<label class="tb-field"><span class="tb-field__label">한줄소개</span><input class="tb-input" placeholder="좋아하는 게임이나 한마디"><span class="tb-field__hint">100자까지</span></label>

<div class="panel" style="background: var(--sunken); border-color: transparent;">
<label class="tb-check" style="font-weight: 600;"><input type="checkbox"> 관리자로 가입 신청</label>
<span class="small muted" style="margin-top: -4px; padding-left: 28px;">최고 관리자 승인 후 관리자 권한이 부여됩니다. 승인 전에는 일반 회원으로 이용해요.</span>
</div>

<button class="tb-btn tb-btn--primary tb-btn--lg tb-btn--block" type="submit">가입하기</button>
</form>
</main>
</div>

</body>
</html>
