<div><b class="num">2</b><span>보유(개)</span></div>

</div>

<p style="margin: 0; font-size: 15px; line-height: 24px;">섬에 정착해 자원을 모으고, 다른 사람과 거래하며 마을과 도시를 키우는 게임이에요. 주사위 운과 협상이 반반이라 처음 하는 사람도 금방 끼어들 수 있어요.</p>
<p class="small muted" style="margin: -8px 0 0;">등록한 관리자 · 은혜</p>
