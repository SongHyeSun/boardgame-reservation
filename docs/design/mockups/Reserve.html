<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>대여 예약</title>
<link rel="stylesheet" href="ds/boardclub/components/bundle.css">
<link rel="stylesheet" href="screens.css">
</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}
</style>

<div class="scr" style="width: 390px; height: 1000px; --page-action-bar: 76px;">
<header class="hdr">
<a class="logo" href="Main.html"><svg class="logo-mark" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" style="fill:var(--felt)"></rect><circle cx="8" cy="8" r="2.5" style="fill:var(--meeple)"></circle><circle cx="13" cy="13" r="2.5" style="fill:var(--meeple)"></circle><circle cx="18" cy="18" r="2.5" style="fill:var(--meeple)"></circle></svg>보드게임 동아리</a>
<div class="bell-wrap"><button class="tb-icon-btn" aria-label="알림 3개"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg></button><span class="bell-count">3</span></div>
<a class="tb-icon-btn" href="Me.html" aria-label="내 정보"><span class="tb-avatar s3">🎲</span></a>
<a class="tb-icon-btn" href="MobileMenu.html" aria-label="메뉴"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></a>
</header>

<main class="page" style="padding-bottom: 100px;">
<a class="back" href="GameDetail.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>카탄</a>
<div>
<h1 class="page-title">카탄 대여 예약</h1>
<p class="lede">오늘부터 60일 안, 최대 7일까지 빌릴 수 있어요</p>
</div>

<div class="tb-seg" role="group" aria-label="대여 기간" style="width: 100%;"><button aria-pressed="false" style="flex-grow: 1;">당일</button><button aria-pressed="true" style="flex-grow: 1;">여러 날</button></div>

<div class="cal">
<div class="cal__head">
<button class="tb-icon-btn" aria-label="이전 달" style="width: 36px; height: 36px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m15 18-6-6 6-6"></path></svg></button>
<span class="cal__month num">2026년 10월</span>
<button class="tb-icon-btn" aria-label="다음 달" style="width: 36px; height: 36px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m9 18 6-6-6-6"></path></svg></button>
</div>
<div class="cal__grid">
<span class="cal__dow" style="color: var(--danger);">일</span><span class="cal__dow">월</span><span class="cal__dow">화</span><span class="cal__dow">수</span><span class="cal__dow">목</span><span class="cal__dow">금</span><span class="cal__dow">토</span>
<span></span><span></span><span></span><span></span><button class="day day--past" disabled>1</button><button class="day day--past" disabled>2</button><button class="day day--past" disabled>3</button>
<button class="day day--past" disabled>4</button><button class="day day--past" disabled>5</button><button class="day day--past" disabled>6</button><button class="day day--past" disabled>7</button><button class="day day--today">8<small>2개</small></button><button class="day">9<small>2개</small></button><button class="day day--sel day--start">10<small>시작</small></button>
<button class="day day--mid">11<small>1개</small></button><button class="day day--sel day--end">12<small>반납</small></button><button class="day">13<small>2개</small></button><button class="day day--full" disabled>14<small>마감</small></button><button class="day day--full" disabled>15<small>마감</small></button><button class="day">16<small>1개</small></button><button class="day">17<small>2개</small></button>
<button class="day">18<small>2개</small></button><button class="day">19<small>2개</small></button><button class="day">20<small>2개</small></button><button class="day">21<small>2개</small></button><button class="day">22<small>2개</small></button><button class="day">23<small>2개</small></button><button class="day">24<small>1개</small></button>
<button class="day">25<small>2개</small></button><button class="day">26<small>2개</small></button><button class="day">27<small>2개</small></button><button class="day">28<small>2개</small></button><button class="day">29<small>2개</small></button><button class="day">30<small>2개</small></button><button class="day">31<small>2개</small></button>
</div>
</div>

<div class="legend">
<span><i style="background: var(--meeple);"></i>선택한 기간</span>
<span><i style="background: var(--sunken);"></i>예약 마감</span>
<span><i style="box-shadow: inset 0 0 0 1.5px var(--felt);"></i>오늘</span>
<span><b style="color: var(--felt); font-size: 11px;">2개</b>남은 수량</span>
</div>
</main>

<div class="action-bar">
<div class="action-bar__info"><b class="num">10/10(토) ~ 10/12(월)</b><span>3일 · 관리자 승인 후 확정</span></div>
<button class="tb-btn tb-btn--primary tb-btn--lg" style="margin-bottom: 0;">예약 신청</button>
</div>
</div>

</body>
</html>
