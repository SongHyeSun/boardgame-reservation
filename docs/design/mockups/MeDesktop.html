<div class="scr" style="width: 1280px; height: 960px;">

<nav class="nav" aria-label="주 메뉴"><a href="GameListDesktop.html">보드게임</a><a href="PartyListDesktop.html">파티</a><a href="ChatDesktop.html">AI 추천</a><a href="MyReservationsDesktop.html">내 예약</a></nav>
<div class="bell-wrap"><button class="tb-icon-btn" aria-label="알림 1개"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg></button><span class="bell-count">1</span></div>

<div class="me-grid">
<aside class="tb-card profile-card">

<div><b style="display: block; font-size: 22px; line-height: 28px;">민지</b><span class="small muted">찬양팀에서 건반 쳐요. 추리 게임 좋아해요</span></div>

<div style="display: flex; flex-direction: column; gap: 24px; min-width: 0;">
<section class="section">
<h2 class="section-title" style="font-size: 17px; line-height: 24px;">기본 정보</h2>
<div class="panel">
<dl class="kv" style="grid-template-columns: 120px 1fr;">
<dt>이메일</dt><dd>minji@example.com</dd>
<dt>이름</dt><dd>이민지</dd>
<dt>생년월일</dt><dd class="muted">입력 안 함</dd>
<dt>소속</dt><dd>찬양팀</dd>
<dt>직업</dt><dd class="muted">입력 안 함</dd>
</dl>
</div>
</section>

<section class="section">
<h2 class="section-title" style="font-size: 17px; line-height: 24px;">관리자 권한</h2>

<span class="small muted">게임을 등록하고 예약을 관리하려면 관리자 권한이 필요해요. 최고 관리자가 승인해요.</span>
<button class="tb-btn tb-btn--secondary tb-btn--sm">관리자 신청</button>
</div>
</section>

<section class="section">

<div class="panel form" style="gap: 12px;">
<div class="two">
<label class="tb-field"><span class="tb-field__label">현재 비밀번호</span><input class="tb-input" type="password"></label>
<label class="tb-field"><span class="tb-field__label">새 비밀번호</span><input class="tb-input" type="password"></label>
</div>
<button class="tb-btn tb-btn--secondary" style="align-self: flex-end;">변경하기</button>
</div>
